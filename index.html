<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIIN Staff Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1c1230; --dusk:#4a2a5c; --ember:#e8833a; --sun:#f6b14c;
  --sand:#f1deb4; --brass:#c9a24b; --saddle:#4b2f1c;
  --glass:rgba(34,16,44,.45); --glass-line:rgba(255,226,170,.35);
  --text:#fbf1da; --muted:#d9c49c;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh; color:var(--text); font-family:'Alegreya',Georgia,serif; font-size:18px; line-height:1.5;
  background:linear-gradient(180deg,#140c24 0%,#2d1a45 28%,#8a3d4f 58%,#e8833a 82%,#f6b14c 100%) fixed;
  padding:0 16px 40px; overflow-x:hidden;
}
/* sky scenery */
.sun{position:fixed;left:50%;bottom:-120px;width:340px;height:340px;margin-left:-170px;border-radius:50%;
  background:radial-gradient(circle,#fff3c4 0%,#f6b14c 45%,rgba(232,131,58,0) 72%);z-index:-2;
  animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(260px);opacity:0}to{transform:none;opacity:1}}
.mesa{position:fixed;left:0;right:0;bottom:0;height:38vh;min-height:220px;z-index:-1;pointer-events:none}
.mesa svg{width:100%;height:100%;display:block}
.stars{position:fixed;inset:0 0 50% 0;z-index:-2;opacity:.7;
  background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 33% 8%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 58% 26%,#fff,transparent),radial-gradient(1px 1px at 79% 12%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 91% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 36%,#fff,transparent)}

.wrap{max-width:980px;margin:0 auto}
header{text-align:center;padding:56px 0 28px}
.badge{width:92px;height:92px;margin:0 auto 14px;animation:spin 1.6s cubic-bezier(.2,.9,.3,1) both .3s;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
@keyframes spin{from{transform:rotate(-200deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Rye',Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,60px);line-height:1.08;color:var(--sand);
  text-shadow:0 3px 0 var(--saddle),0 8px 24px rgba(0,0,0,.45)}
.sub{max-width:520px;margin:12px auto 0;color:var(--muted)}

.glass{
  background:var(--glass); border:1px solid var(--glass-line); border-radius:22px;
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 50px rgba(10,4,24,.38);
}
form.search{display:flex;gap:10px;padding:10px;max-width:560px;margin:26px auto 0;border-radius:999px}
input{font:inherit;color:var(--text);background:rgba(20,10,30,.35);border:1px solid transparent;border-radius:999px;padding:12px 20px;outline:none;min-width:0}
input::placeholder{color:#c9b48c}
input:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
form.search input{flex:1;font-size:20px;letter-spacing:.04em}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;color:#2a1608;
  background:linear-gradient(180deg,#ffd27a,#e8963a);box-shadow:0 3px 0 #8a4f1c,0 8px 18px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(3px);box-shadow:0 0 0 #8a4f1c}
button.ghost{background:var(--glass);color:var(--text);box-shadow:none;border:1px solid var(--glass-line);padding:8px 18px;font-weight:500}

#status{text-align:center;margin:26px 0;color:var(--sand);min-height:28px}
.err{display:inline-block;padding:14px 22px;border-radius:16px;background:rgba(120,20,20,.45);border:1px solid rgba(255,150,130,.5)}
.dots span{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--sun);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-9px);opacity:1}}

h2{font-family:'Rye',Georgia,serif;font-weight:400;font-size:26px;color:var(--sand);margin:34px 0 14px;text-shadow:0 2px 0 var(--saddle)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:34px 0 14px}
.bar h2{margin:0}
.bar .tools{display:flex;gap:10px;flex-wrap:wrap}
.bar input{background:rgba(20,10,30,.4);border:1px solid var(--glass-line);padding:9px 16px;font-size:16px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,226,170,.7)}
.card.head{border-color:rgba(246,177,76,.8);background:rgba(92,48,18,.58)}
.av{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brass),var(--saddle));font-family:'Rye',serif;font-size:24px;color:var(--sand);border:2px solid var(--brass)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.card>div:last-child{min-width:0}
.card b{display:block;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.card small{color:var(--muted);font-size:15px}
.stat{text-align:center;color:var(--muted);margin-top:8px}
.more{display:block;margin:24px auto 0}
pre{margin-top:14px;padding:16px;border-radius:16px;max-height:420px;overflow:auto;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--sand)}
.card,.head-in{animation:pop .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

footer{max-width:980px;margin:64px auto 0;text-align:center;font-size:16px;color:var(--muted);padding-bottom:6px}
footer svg{width:14px;height:14px;vertical-align:-1px;margin:0 8px;fill:#ffd98a;filter:drop-shadow(0 0 6px rgba(255,200,100,.7))}
footer b{font-family:'Rye',Georgia,serif;font-weight:400;font-size:21px;color:#ffe7b0;text-shadow:0 1px 0 #7a4a14,0 0 14px rgba(255,190,90,.55)}
@media (max-width:520px){body{font-size:17px}form.search{flex-direction:column;border-radius:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="sun"></div>
<div class="mesa">
  <svg viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 300V190l90-8 30-52h110l26 48 90 6 24-30h96l30 34 120 4 40-56h130l24 50 84 2 30-44h120l36 62 100 8 32-40h108V300Z" fill="#6b2f44" opacity=".75"/>
    <path d="M0 300V240l140-10 36-40h98l30 36 120-4 28-48h120l26 46 150 8 38-34h104l32 38 140-6 40-50h98l28 54 52 6V300Z" fill="#3a1c33"/>
    <path d="M0 300V272l180-6 60-22 80 20 220-8 90-26 70 28 240-10 90-18 80 22 190-4V300Z" fill="#170b1f"/>
  </svg>
</div>

<div class="wrap">
  <header>
    <svg class="badge" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 61,34 94,36 68,56 77,90 50,70 23,90 32,56 6,36 39,34" fill="#c9a24b" stroke="#6e4b14" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="13" fill="#4b2f1c"/><circle cx="50" cy="50" r="7" fill="#f6b14c"/>
      <g fill="#e9c872"><circle cx="50" cy="4" r="4"/><circle cx="94" cy="36" r="4"/><circle cx="77" cy="90" r="4"/><circle cx="23" cy="90" r="4"/><circle cx="6" cy="36" r="4"/></g>
    </svg>
    <h1>EIIN Staff Registry</h1>
    <p class="sub">Enter an institute's EIIN to pull up its head and the full staff roll.</p>
    <form class="search glass" id="f" autocomplete="off">
      <input id="eiin" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="EIIN, e.g. 104532" aria-label="EIIN number" required>
      <button type="submit">Search</button>
    </form>
  </header>

  <div id="status" role="status" aria-live="polite"></div>
  <main id="out" hidden>
    <div id="sum" class="stat"></div>
    <h2>Head of institute</h2>
    <div class="grid" id="heads"></div>
    <div class="bar">
      <h2>All staff</h2>
      <div class="tools">
        <input id="q" placeholder="Filter by name or post" aria-label="Filter staff">
        <button class="ghost" id="rawBtn" type="button">Raw JSON</button>
        <button class="ghost" id="copyBtn" type="button">Copy JSON</button>
      </div>
    </div>
    <div class="grid" id="list"></div>
    <button class="ghost more" id="more" type="button" hidden>Show more</button>
    <pre class="glass" id="raw" hidden></pre>
  </main>
</div>

<footer>Built by<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 61,34 94,36 68,56 77,90 50,70 23,90 32,56 6,36 39,34"/></svg><b id="credit"></b></footer>

<script>
// ---- Settings (edit these two lines) ----
const API    = 'eiin.php';              // path to your PHP script (same folder)
const CREDIT = 'Olive';                 // your name in the footer
// -----------------------------------------
document.getElementById('credit').textContent = CREDIT;
const $ = id => document.getElementById(id);
const PAGE = 24;
let store = null, filtered = [], shown = 0;

const pick = (o, keys) => { for (const k of keys) if (o && o[k]) return o[k]; return ''; };
const toArr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? (Array.isArray(v.content) ? v.content : [v]) : []);
const norm = e => ({
  name: pick(e, ['name','nameEn','fullName','empName','nameBn','employeeName']) || 'Unnamed',
  post: pick(e, ['designationName','designation','post','designationNameEn','designationEn']),
  img:  pick(e, ['image','photo']),
});

function card(e, isHead){
  const el = document.createElement('div'); el.className = 'card glass' + (isHead ? ' head' : '');
  const av = document.createElement('div'); av.className = 'av';
  const initial = () => { av.textContent = (e.name.trim()[0] || '?').toUpperCase(); };
  if (e.img){
    const im = new Image(); im.alt = ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer';
    im.onerror = () => { im.remove(); initial(); };
    av.appendChild(im); im.src = e.img;
  } else initial();
  const t = document.createElement('div');
  const b = document.createElement('b'); b.textContent = e.name;
  const s = document.createElement('small'); s.textContent = e.post || 'Post not listed';
  t.append(b, s); el.append(av, t);
  return el;
}

function renderMore(){
  const slice = filtered.slice(shown, shown + PAGE);
  const frag = document.createDocumentFragment();
  slice.forEach((e,i) => { const c = card(e,false); c.style.animationDelay = (i*30)+'ms'; frag.appendChild(c); });
  $('list').appendChild(frag); shown += slice.length;
  $('more').hidden = shown >= filtered.length;
  $('more').textContent = 'Show more (' + (filtered.length - shown) + ' left)';
}
function applyFilter(){
  const q = $('q').value.trim().toLowerCase();
  filtered = store.staff.filter(e => (e.name + ' ' + e.post).toLowerCase().includes(q));
  $('list').innerHTML = ''; shown = 0;
  if (!filtered.length){ $('list').innerHTML = '<p class="stat" style="grid-column:1/-1">No staff match that filter.</p>'; $('more').hidden = true; return; }
  renderMore();
}

async function search(eiin){
  $('out').hidden = true;
  $('status').innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  try{
    const r = await fetch(API + '?eiin=' + encodeURIComponent(eiin));
    const j = await r.json();
    if (!j.status) throw new Error(j.message || 'The server rejected this request.');
    const heads = toArr(j.headInfo && j.headInfo.data).map(norm);
    const staff = toArr(j.employeeList && j.employeeList.data && j.employeeList.data.content).map(norm);
    store = { raw: j, heads, staff };
    $('status').textContent = '';
    $('sum').textContent = 'EIIN ' + j.eiin + ': ' + heads.length + ' head' + (heads.length===1?'':'s') + ' and ' + staff.length + ' staff found';
    $('heads').innerHTML = '';
    if (heads.length) heads.forEach(h => $('heads').appendChild(card(h,true)));
    else $('heads').innerHTML = '<p class="stat" style="grid-column:1/-1">No head listed for this EIIN.</p>';
    $('q').value = ''; $('raw').hidden = true; $('raw').textContent = JSON.stringify(j, null, 2);
    applyFilter(); $('out').hidden = false;
    $('out').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(err){
    $('status').innerHTML = '';
    const d = document.createElement('div'); d.className = 'err';
    d.textContent = err instanceof SyntaxError ? 'The server did not return valid JSON. Check that eiin.php is in the same folder and PHP is running.' : err.message;
    $('status').appendChild(d);
  }
}

$('f').addEventListener('submit', e => { e.preventDefault(); const v = $('eiin').value.trim(); if (/^\d+$/.test(v)) { history.replaceState(null,'','?eiin='+v); search(v); } else { $('status').innerHTML = '<div class="err">EIIN must contain digits only.</div>'; } });
$('q').addEventListener('input', () => store && applyFilter());
$('more').addEventListener('click', renderMore);
$('rawBtn').addEventListener('click', () => { const r = $('raw'); r.hidden = !r.hidden; $('rawBtn').textContent = r.hidden ? 'Raw JSON' : 'Hide JSON'; });
$('copyBtn').addEventListener('click', async () => { try{ await navigator.clipboard.writeText($('raw').textContent); $('copyBtn').textContent = 'Copied'; }catch{ $('copyBtn').textContent = 'Copy failed'; } setTimeout(()=>$('copyBtn').textContent='Copy JSON',1500); });
const pre = new URLSearchParams(location.search).get('eiin');
if (pre && /^\d+$/.test(pre)) { $('eiin').value = pre; search(pre); }
</script>
</body>
</html>
